# Publica o app Android (flavor prod) no Google Play. Sozinho quando chega ao main uma VERSÃO NOVA (a linha
# "version:" do app/pubspec.yaml mudou; decisão do dev, 22/10/2026: subir a versão é a decisão de publicar),
# ou no botão (Actions → Android → Run workflow, a partir do main) para reenviar.
# A versão é a do app/pubspec.yaml: suba o número depois do "+" a cada envio (a Play recusa repetido).
# Notas da versão: release.txt (vira o "Novidades" do Play) e o topo do versions.txt (docs/app.md#publicar-no-android).
# Secrets (além dos do app.yml), passo a passo em docs/app.md#publicar-no-android:
#   ANDROID_KEYSTORE_BASE64              o .jks da chave de upload em base64
#   ANDROID_KEY_PROPERTIES               conteúdo do android/key.properties, com storeFile=upload.jks
#   GOOGLE_SERVICES_PROD                 conteúdo de app/android/app/src/prod/google-services.json
#   PLAY_SERVICE_ACCOUNT_JSON            chave JSON da conta de serviço com acesso ao app no Play Console
name: Android

# Vai sempre para o teste interno como rascunho: liberar (e promover a produção) é no Play Console.
on:
  push:
    branches: [main]
    paths: ['app/pubspec.yaml']
  workflow_dispatch:

concurrency: android

defaults:
  run:
    working-directory: app

# Token da esteira só lê o repositório (nada aqui escreve no GitHub).
permissions:
  contents: read

jobs:
  # O pubspec também muda quando só se atualiza um pacote: publica só se a linha "version:" mudou no push.
  versao:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # para ler o pubspec de antes do push
      - id: v
        env:
          ANTES: ${{ github.event.before }}
        run: |
          agora=$(grep -m1 '^version:' pubspec.yaml)
          antes=$(git show "$ANTES:app/pubspec.yaml" 2>/dev/null | grep -m1 '^version:' || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$agora" != "$antes" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"; echo "publicar: ${antes:-?} → $agora"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"; echo "::notice::versão não mudou ($agora): nada a publicar"
          fi

  android:
    needs: versao
    if: needs.versao.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3 # a mesma da máquina de desenvolvimento
          channel: stable
          cache: true
      - name: Config e chave dos secrets
        env:
          FIREBASE_OPTIONS_DEV: ${{ secrets.FIREBASE_OPTIONS_DEV }}
          FIREBASE_OPTIONS_PROD: ${{ secrets.FIREBASE_OPTIONS_PROD }}
          APP_CONFIG_PROD: ${{ secrets.APP_CONFIG_PROD }}
          GOOGLE_SERVICES_PROD: ${{ secrets.GOOGLE_SERVICES_PROD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for s in FIREBASE_OPTIONS_DEV FIREBASE_OPTIONS_PROD APP_CONFIG_PROD GOOGLE_SERVICES_PROD \
                   ANDROID_KEYSTORE_BASE64 ANDROID_KEY_PROPERTIES PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!s}" ] || { echo "::error::falta o secret $s"; exit 1; }
          done
          printf '%s\n' "$FIREBASE_OPTIONS_DEV" > lib/firebase_options_dev.dart
          printf '%s\n' "$FIREBASE_OPTIONS_PROD" > lib/firebase_options_prod.dart
          printf '%s\n' "$APP_CONFIG_PROD" > config/prod.json
          jq -e . config/prod.json > /dev/null || { echo "::error::APP_CONFIG_PROD não é um JSON válido"; exit 1; }
          mkdir -p android/app/src/prod
          printf '%s\n' "$GOOGLE_SERVICES_PROD" > android/app/src/prod/google-services.json
          # storeFile do key.properties é relativo a android/app/
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
          grep -q '^storeFile=upload.jks' android/key.properties || { echo "::error::ANDROID_KEY_PROPERTIES precisa de storeFile=upload.jks"; exit 1; }
      - name: Notas da versão
        run: |
          v=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          head -1 ../versions.txt | tr -d '\r' | grep -qx "v $v" || { echo "::error::o topo do versions.txt não é \"v $v\""; exit 1; }
          n=$(tr -d '\r' < ../release.txt | wc -m)
          [ "$n" -ge 1 ] && [ "$n" -le 300 ] || { echo "::error::release.txt com $n caracteres (1 a 300)"; exit 1; }
          mkdir -p ../novidades && tr -d '\r' < ../release.txt > ../novidades/whatsnew-pt-BR
      - run: flutter pub get
      - run: flutter test
      # VERSAO: vai junto com as sugestões e relatos de problema do app (config.dart)
      - run: |
          flutter build appbundle --release --flavor prod --dart-define-from-file=config/prod.json \
            --dart-define=VERSAO=$(sed -n 's/^version: *//p' pubspec.yaml)
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.promocaonamao.app
          releaseFiles: app/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: draft
          whatsNewDirectory: novidades
