<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mercados — Promoção na Mão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
h1,h2,.f{font-family:'Fredoka','Nunito',system-ui,sans-serif!important;font-weight:600!important}
a{color:#1E7A66}a:hover{color:#0E372E}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F8F7; font-family: 'Nunito', system-ui, sans-serif; color: #1B1D1C; overflow: hidden">

  <header style="padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; padding: 10px 0 0">Mercados</h1>
    <span style="font-size: 14px; line-height: 20px; color: #4A4F4C">Do mais perto ao mais longe de você</span>
  </header>

  <main style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 24px">
    <sc-for list="{{mercados}}" as="m" hint-placeholder-count="4">
      <a href="Mercado.dc.html" style="display: flex; align-items: center; gap: 16px; padding: 16px; background: #FFFFFF; border: 1px solid #D9DDD9; border-radius: 16px; text-decoration: none; color: #1B1D1C">
        <span style="width: 48px; height: 48px; flex: none; border-radius: 24px; background: {{m.cor}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">{{m.sigla}}</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 16px; line-height: 24px; font-weight: 600">{{m.nome}}</span>
          <span style="font-size: 14px; line-height: 20px; color: #4A4F4C"><strong style="color: #0E372E">{{m.dist}}</strong> · encarte até {{m.ate}}</span>
          <sc-if value="{{m.temClube}}" hint-placeholder-val="{{false}}">
            <span style="align-self: flex-start; margin-top: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: #0E372E; background: #D6E7E3; padding: 2px 8px; border-radius: 8px">{{m.clube}}</span>
          </sc-if>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4F4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </sc-for>

    <div style="margin-top: 8px; padding: 16px; border-radius: 16px; border: 1px dashed #707971; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; line-height: 20px; font-weight: 600">Seu mercado não está aqui?</span>
      <span style="font-size: 14px; line-height: 20px; color: #4A4F4C">Conte pra gente qual encarte você quer ver no app.</span>
      <a href="#" style="align-self: flex-start; height: 40px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">Sugerir mercado</a>
    </div>
  </main>

  <nav aria-label="Navegação principal" style="height: 80px; flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #EEF0EC; padding-top: 12px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #4A4F4C; font-size: 12px; line-height: 16px; font-weight: 600">
      <span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Início
    </a>
    <a href="Busca.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #4A4F4C; font-size: 12px; line-height: 16px; font-weight: 600">
      <span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>Buscar
    </a>
    <a href="Mercados.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #1B1D1C; font-size: 12px; line-height: 16px; font-weight: 700">
      <span style="width: 64px; height: 32px; border-radius: 16px; background: #D6E7E3; color: #0E372E; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"></path><path d="M4 9v11h16V9"></path><path d="M3 9h18"></path><path d="M10 20v-6h4v6"></path></svg></span>Mercados
    </a>
    <a href="Lista.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #4A4F4C; font-size: 12px; line-height: 16px; font-weight: 600">
      <span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"></path></svg></span>Lista
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      mercados: [
        { nome: 'Big Mais', sigla: 'BM', cor: '#1D4ED8', ate: '03/11', km: 3.5, temClube: true, clube: 'Preço especial com bigmais+' },
        { nome: 'Coelho Diniz', sigla: 'CD', cor: '#B45309', ate: '04/11', km: 2.1, temClube: false },
        { nome: 'Atacadão', sigla: 'AT', cor: '#0F766E', ate: '25/10', km: 0.8, temClube: false },
        { nome: 'Supermercados BH', sigla: 'BH', cor: '#6D28D9', ate: '31/10', km: 1.4, temClube: false },
      ].sort((a, b) => a.km - b.km).map((m) => Object.assign({}, m, { dist: m.km < 1 ? Math.round(m.km * 1000) + ' m' : m.km.toFixed(1).replace('.', ',') + ' km' })),
    };
  }
}
</script>
</body>
</html>
