<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lista da Ana — Promoção na Mão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4F8F7}
h1,h2,.f{font-family:'Fredoka','Nunito',system-ui,sans-serif!important;font-weight:600!important}
a{color:#1E7A66}a:hover{color:#0E372E}
input[type=checkbox]{accent-color:#1E7A66}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F8F7; color: #1B1D1C; font-family: 'Nunito', system-ui, sans-serif">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9DDD9">
    <div style="max-width: 600px; margin: 0 auto; padding: 12px 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Web-Inicio.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1B1D1C">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 22.5 21.5 9H37v15.5L23.5 38a3.4 3.4 0 0 1-4.8 0L8 27.3a3.4 3.4 0 0 1 0-4.8z" fill="#1E7A66"></path><circle cx="31" cy="15" r="2.8" fill="#FFFFFF"></circle><path d="M17 24c1.9 3 5.4 4.2 8.6 2.8" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"></path></svg>
        <span class="f" style="font-size: 20px; line-height: 24px">Promoção <span style="color: #1E7A66">na Mão</span></span>
      </a>
      <span style="font-size: 12px; line-height: 16px; color: #4A4F4C">Atualizada há 5 min</span>
    </div>
  </header>

  <main style="max-width: 600px; margin: 0 auto; padding: 20px 16px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <section style="display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 24px; background: #1E7A66; color: #FFFFFF">
      <span style="font-size: 14px; line-height: 20px; color: #D6E7E3; font-weight: 700">A Ana compartilhou esta lista com você</span>
      <h1 style="margin: 0; font-size: 28px; line-height: 34px">{{progresso}}</h1>
      <div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.25); overflow: hidden"><div style="{{barra}}"></div></div>
      <span style="font-size: 13px; line-height: 18px">Marque o que já pegou. A Ana vê na hora, sem precisar instalar nada.</span>
    </section>

    <sc-for list="{{grupos}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #D9DDD9; border-radius: 16px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #F4F8F7">
          <span style="width: 32px; height: 32px; flex: none; border-radius: 16px; background: {{g.cor}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">{{g.sigla}}</span>
          <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
            <h2 style="margin: 0; font-size: 17px; line-height: 22px">{{g.nome}}</h2>
            <span style="font-size: 12px; line-height: 16px; color: #4A4F4C">{{g.sub}}</span>
          </div>
          <sc-if value="{{g.temMapa}}" hint-placeholder-val="{{true}}">
            <a href="#" aria-label="{{g.mapaLabel}}" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #707971; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; text-decoration: none">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
              Como chegar
            </a>
          </sc-if>
        </div>
        <sc-for list="{{g.itens}}" as="i" hint-placeholder-count="2">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 4px 16px; border-top: 1px solid #E4E7E3; cursor: pointer">
            <input type="checkbox" checked="{{i.pego}}" onChange="{{i.toggle}}" style="width: 22px; height: 22px; margin: 0; flex: none">
            <span style="{{i.nomeStyle}}">{{i.nome}}</span>
            <span style="font-size: 14px; line-height: 20px; font-weight: 800; color: #4A4F4C">{{i.qtd}}×</span>
          </label>
        </sc-for>
      </section>
    </sc-for>

    <button type="button" onClick="{{terminar}}" style="{{botaoStyle}}">{{botaoTexto}}</button>
    <sc-if value="{{avisado}}" hint-placeholder-val="{{false}}">
      <span role="status" style="text-align: center; font-size: 14px; line-height: 20px; font-weight: 700; color: #0E372E">Pronto! A Ana foi avisada.</span>
    </sc-if>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px; border-radius: 16px; border: 1px dashed #707971">
      <span style="flex: 1 1 240px; font-size: 14px; line-height: 20px">Quer montar a sua lista com as ofertas de GV?</span>
      <a href="Web-Inicio.dc.html" style="height: 40px; padding: 0 16px; border-radius: 999px; background: #D6E7E3; color: #0E372E; display: flex; align-items: center; font-size: 14px; font-weight: 800; text-decoration: none">Ver ofertas de hoje</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pegos: { hein: true }, avisado: false };
  }
  renderVals() {
    const M = {
      AT: { nome: 'Atacadão', cor: '#0F766E', ate: '25/10' },
      BH: { nome: 'Supermercados BH', cor: '#6D28D9', ate: '31/10' },
      CD: { nome: 'Coelho Diniz', cor: '#B45309', ate: '04/11' },
    };
    const its = [
      { id: 'hein', nome: 'Cerveja Heineken Lata 473ml', m: 'AT', q: 12 },
      { id: 'cafe', nome: 'Café Gourmet 3 Corações 250g', m: 'AT', q: 1 },
      { id: 'pow', nome: 'Isotônico Powerade 500ml', m: 'AT', q: 2 },
      { id: 'arroz', nome: 'Arroz Agulhinha Camil 5kg', m: 'BH', q: 1 },
      { id: 'det', nome: 'Detergente Ypê 500ml', m: 'BH', q: 3 },
      { id: 'coca', nome: 'Coca-Cola Lata 220ml', m: 'CD', q: 6 },
      { id: 'pao', nome: 'Pão francês', m: null, q: 10 },
    ];
    const pegos = this.state.pegos;
    const feitos = its.filter((i) => pegos[i.id]).length;
    const tudo = feitos === its.length;
    const btn = 'width: 100%; height: 48px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; ';
    return {
      progresso: feitos + ' de ' + its.length + ' itens pegos',
      barra: 'height: 100%; border-radius: 4px; background: #D6E7E3; width: ' + Math.round((feitos / its.length) * 100) + '%',
      grupos: ['AT', 'BH', 'CD', null].map((m) => {
        const g = its.filter((i) => i.m === m);
        const f = g.filter((i) => pegos[i.id]).length;
        return {
          nome: m ? M[m].nome : 'Onde preferir', sigla: m || '?', cor: m ? M[m].cor : '#707971',
          sub: f + ' de ' + g.length + ' pegos' + (m ? ' · ofertas até ' + M[m].ate : ''),
          temMapa: !!m, mapaLabel: m ? 'Como chegar ao ' + M[m].nome : '',
          itens: g.map((i) => {
            const pego = !!pegos[i.id];
            return {
              nome: i.nome, qtd: i.q, pego,
              toggle: () => this.setState({ pegos: Object.assign({}, pegos, { [i.id]: !pego }) }),
              nomeStyle: 'flex: 1; min-width: 0; font-size: 15px; line-height: 20px; font-weight: 600; ' + (pego ? 'text-decoration: line-through; color: #4A4F4C' : ''),
            };
          }),
        };
      }),
      botaoTexto: tudo ? 'Avisar a Ana que terminei' : 'Avisar a Ana que terminei (' + (its.length - feitos) + ' faltando)',
      botaoStyle: btn + (tudo ? 'border: 0; background: #1E7A66; color: #FFFFFF' : 'border: 1px solid #707971; background: transparent; color: #1E7A66'),
      terminar: () => this.setState({ avisado: true }),
      avisado: this.state.avisado,
    };
  }
}
</script>
</body>
</html>
