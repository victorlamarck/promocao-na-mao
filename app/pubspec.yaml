name: promocao_na_mao
description: "A new Flutter project."
publish_to: 'none'
version: 0.7.1+14

environment:
  sdk: ^3.13.3

dependencies:
  firebase_analytics: ^13.0.0
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  geolocator: ^14.1.1
  go_router: ^18.1.0
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  web: ^1.1.1

# shortcut: o google_mobile_ads 9.1.0 diz iOS 13 no Package.swift, mas o webview_flutter_wkwebview 3.27+ exige iOS 15
# e o Xcode recusa ("Target Integrity"). 3.25.1 ainda é iOS 13. Tirar quando o google_mobile_ads corrigir.
dependency_overrides:
  webview_flutter_wkwebview: 3.25.1
  # shortcut: o 2.5.x (17/10/2026) chama o Kotlin por JNI e quebra no release: NoSuchMethodError
  # ...SharedPreferencesApiRegistrar.getAll (Crashlytics, 0.1–0.2.2) e, no 2.5.1, o app trava ao abrir (ANR no Pixel,
  # 21/10/2026). Tirar quando uma versão nova passar no teste: release no celular, trocar a cor, fechar e reabrir.
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/mercados/
  # Fredoka e Nunito (licença OFL, assets/fontes/OFL-*.txt), dentro do app: sem download na 1ª abertura.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fontes/Fredoka-SemiBold.ttf
          weight: 600
    - family: Nunito
      fonts:
        - asset: assets/fontes/Nunito-Regular.ttf
        - asset: assets/fontes/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fontes/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fontes/Nunito-ExtraBold.ttf
          weight: 800
